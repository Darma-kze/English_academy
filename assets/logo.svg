<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#gradBrand)" filter="url(#shadowFilter)"/>
  
  <!-- Subtle inner border -->
  <rect x="9" y="9" width="82" height="82" rx="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Geometric Abstract Academic Compass / Wings / 'A' & 'L' Monogram -->
  <path d="M50 22 L72 68 L50 58 L28 68 Z" fill="#ffffff" opacity="0.95" />
  <path d="M50 22 L50 58 L72 68 Z" fill="#e0e7ff" opacity="0.85" />
  <circle cx="50" cy="46" r="4.5" fill="#4f46e5" />
  <circle cx="50" cy="74" r="3" fill="#ffffff" opacity="0.9" />
</svg>
